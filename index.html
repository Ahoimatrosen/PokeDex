<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PokeDex</title>
        <!-- favicon -->
        <link rel="icon" href="img/favicon/favicon.ico" />
        <!-- CSS -->
        <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />
        <link rel="stylesheet" href="./style.css" />
        <!-- JavaScript -->
        <script defer src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
        <script defer src="./script.js"></script>
        <script defer src="./scripts/templates.js"></script>
    </head>

    <body onload="init()">
        <!-- #region header -->
        <header class="d-flex justify-content-center">
            <h1 class="">PokeDex</h1>
        </header>
        <!-- #endregion -->
        <!-- #region pokemon-cards -->
        <div class="container d-flex"><div id="pokemon-card" class="row row-cols-1 md:row-cols-2 g-4"></div></div>
        <!-- #endregion -->
        <!-- #region loading button -->
        <button onclick="loadMorePokemon()" type="button" class="btn btn-success btn-lg">More Pokemon</button>
        <!-- #endregion -->
        <!-- #region offcanvas pokemon-details -->
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
            <!-- #region offcanvas-header -->
            <div id="offcanvas-header" class="offcanvas-header">
                <div class="d-flex flex-column justify-content-center w-100">
                    <div>
                        <div class="d-flex w-100 justify-content-between card-background">
                            <div class="d-flex align-items-center justify-content-between p-3 w-100">
                                <h4 id="offcanvas-pokemon-name" class="offcanvas-title"></h4>
                                <h4 id="offcanvas-pokemon-id" class="offcanvas-title"></h4>
                            </div>
                            <button type="button" class="btn-close p-3" data-bs-theme="dark" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                        </div>
                        <img class="w-100" id="offcanvas-pokemon-img" src="" alt="pokemon-img" />
                    </div>
                </div>
            </div>
            <!-- #endregion -->
            <!-- #region offcanvas-body -->
            <div id="offcanvas-body" class="offcanvas-body card-background d-flex flex-column align-items-center">
                <!-- #region offcanvas-body-tabs -->
                <ul class="nav nav-tabs" id="myTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link active"
                            id="general-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#general-tab-pane"
                            type="button"
                            role="tab"
                            aria-controls="general-tab-pane"
                            aria-selected="true"
                        >
                            General
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link"
                            id="base-stats-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#base-stats-tab-pane"
                            type="button"
                            role="tab"
                            aria-controls="base-stats-tab-pane"
                            aria-selected="false"
                        >
                            Base-Stats
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link"
                            id="contact-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#contact-tab-pane"
                            type="button"
                            role="tab"
                            aria-controls="contact-tab-pane"
                            aria-selected="false"
                        >
                            Contact
                        </button>
                    </li>
                </ul>
                <!-- #endregion -->
                <!-- #region offcanvas-body-tabs-content -->
                <div class="tab-content" id="myTabContent">
                    <!-- #region offcanvas-body-tabs-content-general-table  -->
                    <div class="tab-pane fade show active" id="general-tab-pane" role="tabpanel" aria-labelledby="general-tab" tabindex="0">
                        <table class="general-table" id="general-table"></table>
                    </div>
                    <!-- #endregion -->
                    <!-- #region offcanvas-body-tabs-content-base-stats-table  -->
                    <div class="tab-pane fade" id="base-stats-tab-pane" role="tabpanel" aria-labelledby="base-stats-tab" tabindex="0">
                        <table id="base-stats-table"></table>
                    </div>
                    <!-- #endregion -->

                    <!-- offcanvas-body-tabs-content-evolution  -->
                    <div class="tab-pane fade" id="contact-tab-pane" role="tabpanel" aria-labelledby="contact-tab" tabindex="0">...</div>
                    <!-- #endregion -->
                </div>
                <!-- #endregion -->
            </div>
            <!-- #endregion -->
        </div>
        <!-- #endregion -->
    </body>
</html>
